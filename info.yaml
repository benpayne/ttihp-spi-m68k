# Tiny Tapeout project information
project:
  title:        "68k SPI Bridge"           # Project title
  author:       "Ben Payne"                # Your name
  discord:      "interlude_audio_ben"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Hardware SPI master bridge for a 68k-based retrocomputer"   # One line description of what your project does
  language:     "Verilog"                  # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     25000000                   # 25 MHz - no audio-style constraint here, plain round divider base for SPI_SCLK

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_benpayne_spi_bridge"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "dual_fifo.v"
    # TODO (implementing agent): add bus68k_if.v, spi_master.v etc. as they're
    # written, and keep this list + test/Makefile's PROJECT_SOURCES in sync.

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
# See docs/design/spi-i2c-bridge.md #2 and docs/design/68k-bus-interface.md #3 for the rationale.
pinout:
  # Inputs - 68k bus control/address (68008-style, single byte lane) + SPI MISO
  ui[0]: "cs_n"
  ui[1]: "as_n"
  ui[2]: "r_w"
  ui[3]: "ds_n"
  ui[4]: "a1"
  ui[5]: "a2"
  ui[6]: "a3"
  ui[7]: "miso"

  # Outputs
  uo[0]: "dtack_n"
  uo[1]: "irq_n"
  uo[2]: "sclk"
  uo[3]: "mosi"
  uo[4]: "cs0_n"
  uo[5]: "cs1_n"
  uo[6]: ""
  uo[7]: ""

  # Bidirectional pins - 68k data bus D0-D7
  uio[0]: "d0"
  uio[1]: "d1"
  uio[2]: "d2"
  uio[3]: "d3"
  uio[4]: "d4"
  uio[5]: "d5"
  uio[6]: "d6"
  uio[7]: "d7"

# Do not change!
yaml_version: 6
